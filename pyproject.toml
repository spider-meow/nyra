[project]
name = "rightswatch"
version = "0.1.0"
description = "Deterministic CLI tool to detect reference/licensed images on a crawled website, ranked by rights-expiry urgency."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "playwright>=1.44",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "open_clip_torch>=2.24",
    "torch>=2.2",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rightswatch = "rightswatch.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rightswatch*"]

[tool.setuptools.package-data]
rightswatch = ["static/*"]
