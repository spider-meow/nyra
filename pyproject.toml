[project]
name = "nyra"
version = "0.2.0"
description = "Detect rights-managed reference images on websites, ranked by rights-expiry urgency."
requires-python = ">=3.11"
readme = "README.md"
# What the web process needs. The worker adds the [worker] extra.
dependencies = [
    "typer>=0.27.3",
    "imagehash>=4.3.2",
    "Pillow>=13.0.0",
    "numpy>=2.4.6",
    "Jinja2>=3.1.6",
    "PyYAML>=6.0.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "tqdm>=4.70.1",
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.34",
    "psycopg[binary,pool]>=3.3.9",
    "pgvector>=0.5.1",
    "supabase>=2.34.1",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
# Chromium, the CLIP model and OpenCV (keypoint check of CLIP candidates):
# `nyra worker` and the offline CLI pipeline.
worker = [
    # torch brings filelock; 3.32.3 has 3 known advisories (pip-audit), fixed in 4.2.1.
    "filelock>=4.2.4",
    # The worker image is mcr.microsoft.com/playwright/python:v1.64.1 and installs playwright==1.64.1 (Dockerfile): its Chromium
    # matches that version exactly. A higher floor here makes that install impossible; raise both together, by hand.
    "playwright>=1.64.1",
    "pypdf>=7.1.1",  # reads the sheets of the report's first print, for the page numbers of its contents (`nyra.pdf`)
    "open_clip_torch>=4.2.2",
    "torch>=2.15.0",
    "opencv-python-headless>=4.8",
]
# Error reporting (Sentry), enabled by SENTRY_DSN. See docs/OBSERVABILITY.md.
observability = [
    "sentry-sdk[fastapi]>=2.73.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
nyra = "nyra.cli:app"

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["nyra*"]

[tool.setuptools.package-data]
nyra = ["templates/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = [
    # starlette's TestClient now prefers `httpx2`; the project depends on `httpx`, which still works (only the TestClient import warns).
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F841"]
