name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nyra_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # CPU torch keeps the install small. torchvision comes from the same index:
      # one from PyPI next to this torch fails on import ("torchvision::nms does not exist").
      # The CLIP tests download the model weights (~600 MB) when they are not in the cache (step below).
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2" torchvision
      - run: pip install -e ".[worker,dev]"
      # The CLIP tests download the model weights (~600 MB): kept from one run to the next, under a key made of the model named
      # in config.yaml (another model, another key). With no cache, or a miss, the tests download them as before.
      - id: clip
        run: |
          model=$(grep -E '^\s*clip_(model_name|pretrained):' config.yaml | sed -E 's/.*: *"?([^"]*)"?/\1/' | tr '\n' '-')
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: clip-${{ steps.clip.outputs.model }}
      - run: ruff check backend
      - run: pytest -q
      # Known vulnerabilities in the installed dependencies (PyPI advisory database). pip-audit has no
      # severity threshold: any advisory fails the job. To accept one, add `--ignore-vuln <ID>` below with
      # a comment saying why and when to look again; never switch the step off. pip, setuptools and wheel
      # are the runner's tooling, not shipped code. "+cpu" is torch's local version, unknown to PyPI.
      - run: |
          pip freeze --exclude-editable | sed 's/+.*//' | grep -Ev '^(pip|setuptools|wheel)==' > audited.txt
          pipx run pip-audit==2.10.1 -r audited.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails on a high or critical advisory (lower ones are left to Dependabot, to keep the noise down).
      - run: npm audit --audit-level=high
      - run: npm run build
      # First-load JS budget (frontend/size-budget.json) and the browser-monitoring scrubbers.
      - run: npm run size
      - run: npm run check:maps
      - run: npm run check:scrub
      - run: npm run check:paths
      - run: npm run check:retry
      - run: npm run check:drop
      - run: npm run check:selection
      - run: npm run check:emails
      - run: npx playwright install --with-deps chromium
      - run: npm run check:remember

  # Secrets in the whole git history. The gitleaks binary is pinned and checked against its SHA-256
  # (gitleaks-action asks for a paid licence on GitHub organizations). Default rules, plus one false positive
  # listed by exact fingerprint in .gitleaksignore. Both are read from the PR's own tree, so a PR can edit
  # .gitleaksignore and turn this job green: review changes to that file (see docs/DEPLOYMENT.md). Findings are redacted.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --redact --no-banner .
