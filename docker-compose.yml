# Postgres, Auth and Storage live on Supabase; this runs the two processes.
#
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     more jobs in parallel (one per organization at a time)
#
# Both read the same .env (see .env.example).

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    restart: unless-stopped
    # Chromium needs room for shared memory; CLIP needs ~1 GB of RAM.
    shm_size: "1gb"
    stop_grace_period: 30s
